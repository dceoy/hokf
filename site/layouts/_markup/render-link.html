{{- $destination := .Destination | htmlUnescape -}}
{{- $href := $destination -}}
{{- if and (hasPrefix $destination "/") (not (hasPrefix $destination "//")) -}}
  {{- $href = strings.TrimPrefix "/" $destination | relURL -}}
{{- end -}}
<a href="{{ $href }}"{{ with .Title }} title="{{ . }}"{{ end }}>{{ .Text | safeHTML }}</a>
