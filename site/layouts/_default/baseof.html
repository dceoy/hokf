<!doctype html>
<html lang="{{ .Site.Language.Locale | default "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ block "title" . }}{{ with .Title }}{{ . }} · {{ end }}{{ .Site.Title }}{{ end }}</title>
    {{ with .Description }}<meta name="description" content="{{ . }}">{{ end }}
    {{ with resources.Get "css/main.css" | minify | fingerprint }}
      <link rel="stylesheet" href="{{ .RelPermalink }}">
    {{ end }}
    <link rel="stylesheet" href="{{ "pagefind/pagefind-ui.css" | relURL }}">
  </head>
  <body>
    <header class="site-header" data-pagefind-ignore>
      <nav aria-label="Primary navigation">
        <a class="site-title" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
        <a href="#search">Search</a>
      </nav>
      <div
        id="search"
        data-pagefind-ui="{{ "pagefind/pagefind-ui.js" | relURL }}"
        data-pagefind-bundle="{{ "pagefind/" | relURL }}"
      >
        <p id="search-status">Search is available after the Pagefind index is generated.</p>
      </div>
    </header>
    <main data-pagefind-body>
      {{ block "main" . }}{{ end }}
    </main>
    <footer data-pagefind-ignore>
      <p>Generated from canonical Open Knowledge Format v0.2 source.</p>
    </footer>
    <script>
      (function () {
        const search = document.querySelector("[data-pagefind-ui]");
        const script = document.createElement("script");
        script.src = search.dataset.pagefindUi;
        script.onload = function () {
          document.querySelector("#search-status")?.remove();
          new window.PagefindUI({
            element: "#search",
            bundlePath: search.dataset.pagefindBundle,
            showSubResults: true,
          });
        };
        script.onerror = function () {
          // A plain Hugo preview intentionally works before Pagefind has run.
        };
        document.head.appendChild(script);
      })();
    </script>
  </body>
</html>
